[package]
name = "quietdo"
version = "0.4.0"
description = "QuietDo (轻作), a local-first personal task workspace"
authors = ["weieast1314"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/weieast1314/quietdo"
homepage = "https://github.com/weieast1314/quietdo"
publish = false

[lib]
name = "quietdo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
