name: Bug report
description: Report a reproducible problem in QuietDo
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Remove personal task content and credentials before attaching logs or backups. Security issues must be reported privately through SECURITY.md.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Web / PWA
        - macOS
        - Android
        - Windows experimental build
        - Linux experimental build
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: QuietDo version
      placeholder: "0.4.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, browser, and architecture
      placeholder: "macOS 15.5, Apple M2 / Android 15, Pixel 8"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal task data, credentials, keys, and private URLs.
          required: true
