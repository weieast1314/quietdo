name: Feature request
description: Propose a focused improvement to QuietDo
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What task-management problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful outcome, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Privacy and platform considerations
      description: Note data sent off-device, permissions, sync behavior, and affected platforms.
  - type: checkboxes
    id: scope
    attributes:
      label: Product fit
      options:
        - label: This keeps tasks—not chat or autonomous computer control—as the primary product object.
          required: true
